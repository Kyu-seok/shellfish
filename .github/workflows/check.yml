name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check

  # Builds everything a version would publish, and publishes nothing, so a
  # broken config fails here instead of on a tag.
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          TAP_GITHUB_TOKEN: unused # a snapshot pushes nothing
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node npm/build.mjs 0.0.0-snapshot dist dist/npm
      - run: npm/publish.sh dist/npm --dry-run
