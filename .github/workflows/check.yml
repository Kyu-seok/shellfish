name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check

  # make publish-check: builds everything a version would publish, publishes
  # nothing, and checks it with Homebrew and npm, so a broken config fails
  # here instead of on a tag.
  publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: goreleaser
        run: echo "version=$(make -s goreleaser-version)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          install-only: true
      - run: make publish-check GORELEASER=goreleaser
        env:
          REQUIRE_BREW: "1" # the runner image has Homebrew; fail if it's gone
